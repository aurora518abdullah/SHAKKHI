<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHAKKHI · সাক্ষী | Digital Safety Workspace</title><meta name="theme-color" content="#174b3c"><meta name="description" content="A Bangla-first, privacy-conscious workspace for organizing user-provided information and choosing next steps.">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;700&family=Source+Serif+4:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1e9;--paper:#fffefa;--ink:#1b352d;--mute:#65776e;--line:#ded9ce;--pine:#174b3c;--teal:#3d8b78;--tint:#e5f0e9;--coral:#c66c56;--sand:#f5e9cf;--r:18px;--serif:'Noto Serif Bengali','Source Serif 4',Georgia,serif;--sans:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:radial-gradient(circle at 88% 4%,#e5eee6 0,transparent 26%),var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:linear-gradient(160deg,#174b3c,#123b31 72%,#0d3027);color:#e9f1ec;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font:700 26px var(--serif);padding:0 10px 18px;line-height:1.2}.brand small{display:block;font:500 12px var(--sans);color:#a9c5ba}
aside button.nv{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:8px;display:flex;gap:11px;align-items:center}
aside button.nv:hover{background:#1d5a4c}aside button.nv[aria-current=page]{background:#e9f1ec;color:var(--pine);font-weight:600}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;font-size:13px;color:#b9d2c7;padding:10px}
main{padding:28px clamp(16px,4vw,52px) 70px;max-width:1040px;width:100%}
.bar{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.mob{display:none}
h1{font:700 clamp(26px,4vw,38px)/1.25 var(--serif);margin:0 0 8px;letter-spacing:-.01em}h2{font:700 20px/1.3 var(--serif);margin:0 0 8px}h3{font:600 16px var(--sans);margin:0 0 4px}
p{margin:0 0 10px;max-width:68ch}.mute{color:var(--mute)}.sm{font-size:14px}
.btn{border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:12px;padding:9px 16px;font-weight:600;min-height:42px}
.btn:hover{background:var(--teal)}.btn.ghost{background:transparent;color:var(--pine)}.btn.ghost:hover{background:var(--tint)}.btn.warn{border-color:var(--coral);color:var(--coral);background:transparent}.btn.s{padding:5px 11px;min-height:34px;font-size:14px}
input,select,textarea{width:100%;border:1px solid #bdb8a6;border-radius:12px;padding:10px 12px;background:#fff}textarea{min-height:110px;resize:vertical}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 5px}
.sec{border-top:1px solid var(--line);padding:22px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 8px 24px #17302a08}.note{background:var(--sand);border-radius:var(--r);padding:12px 14px;font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--pine)}.tag.ai{background:#e7e4f3;color:#473a85}.tag.user{background:var(--tint)}.tag.ok{background:#d3ead9;color:#17512d}.tag.rev{background:#f8dfd7;color:#8e3422}.tag.demo{background:var(--sand);color:#6b5513}
.hero{padding:30px 0 10px}.hero-art{display:block;width:min(100%,520px);margin:10px auto 0}.hero-panel{background:linear-gradient(130deg,#e5f0e8,#f8eddb);border:1px solid #d6e4d8;border-radius:26px;padding:clamp(18px,4vw,32px);position:relative;overflow:hidden}.hero-panel:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#f0c7a344;right:-40px;top:-65px}.hero-copy{position:relative;z-index:1}.hero-eyebrow{letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:700;color:#54786a}.hero-panel h1{font-size:clamp(28px,5vw,48px);margin-top:8px}.hero-panel .big{font-size:clamp(42px,8vw,74px);color:#174b3c}.feature-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.feature-pills span{background:#ffffffb8;border:1px solid #d1e0d5;padding:5px 11px;border-radius:999px;font-size:13px}.welcome-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center}.mini-illustration{background:#fffaf0;border-radius:22px;padding:12px;border:1px solid #eadfca}.big{font:700 clamp(64px,13vw,128px)/1 var(--serif);color:var(--pine);margin:0}.sub{font:italic 500 20px var(--serif);color:var(--teal)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.step{padding:14px;border-right:1px solid var(--line);background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}.step:last-child{border:0}.step:hover{background:var(--tint)}.step b{display:block}.step span{font-size:13px;color:var(--mute)}
.drop{border:2px dashed #aaa48f;border-radius:var(--r);padding:20px;text-align:center;background:#fff}.drop.on{border-color:var(--teal);background:var(--tint)}
.item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 6px 18px #17302a06}.item img{max-width:200px;max-height:150px;border-radius:6px;border:1px solid var(--line)}
mark{background:#f7d98a;padding:0 2px;border-radius:3px}.chip{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--teal);border-radius:99px;padding:2px 4px 2px 11px;font-size:14px;margin:0 6px 6px 0}.chip button{border:0;background:var(--tint);border-radius:50%;width:22px;height:22px;line-height:1}
.ev{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:16px 0 16px 0;border-bottom:1px solid var(--line)}.ev .d{font-weight:600;color:var(--pine);border-right:3px solid var(--teal);padding-right:12px}
.src{background:none;border:0;color:var(--teal);text-decoration:underline;padding:0;font-size:14px}
.doc{background:#fff;border:1px solid var(--line);padding:clamp(18px,4vw,40px);border-radius:var(--r);font-family:var(--sans)}.doc h2{border-bottom:2px solid var(--pine);padding-bottom:6px;margin-top:22px}
.modal{position:fixed;inset:0;background:#0a2a2288;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}.modal>div{background:var(--paper);border-radius:12px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pine);color:#fff;padding:10px 18px;border-radius:8px;z-index:40;max-width:90vw}
@media(max-width:820px){.welcome-grid{grid-template-columns:1fr}.hero-art{max-width:360px}.shell{display:block}aside{position:fixed;inset:0 20% 0 0;z-index:20;transform:translateX(-105%);transition:transform .2s;height:100%}aside.open{transform:none}.mob{display:inline-flex}.ev{grid-template-columns:1fr}.ev .d{border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{aside,.bar,.noprint,.toast{display:none!important}.shell{display:block}main{padding:0;max-width:none}.doc{border:0;padding:0}body{background:#fff}}

const stTag=e=>`<span class="tag ${e.st==='ok'?'ok':e.st==='rv'?'rev':'ai'}">${t(e.st==='ok'?'sOk':e.st==='rv'?'sRv':'sAi')}</span>`;
function vTimeline(){return `<div class="row" style="justify-content:space-between"><div><h1>${t('s4')}</h1><p class="mute">${t('tlP')}</p></div><button class="btn" data-a="evf">${t('addEvB')}</button></div><div class="sec" style="border:0">${S.ev.length?S.ev.map(e=>`<div class="ev"><div class="d">${esc(e.date)}</div><div><h3>${esc(e.title)}</h3><p>${esc(e.note)}</p><p class="sm"><span class="tag ${e.o==='ai'?'ai':'user'}">${t(e.o==='ai'?'oai':'ouser')}</span> ${stTag(e)} ${e.src?`<button class="src" data-a="src" data-i="${e.src}">${t('sr')}: ${esc(nm(e.src))}</button>`:''}</p><div class="row"><button class="btn s" data-a="evs" data-id="${e.id}" data-s="ok">${t('cf')}</button><button class="btn ghost s" data-a="evs" data-id="${e.id}" data-s="rv">${t('nr')}</button><button class="btn ghost s" data-a="evf" data-id="${e.id}">${t('ed')}</button><button class="btn warn s" data-a="evd" data-id="${e.id}">${t('del')}</button></div></div></div>`).join(''):`<p class="mute">${t('noTl')}</p>`}</div>`}

return `<div class="noprint"><h1>${t('s5')}</h1><label for="rt">${t('rpT')}</label><input id="rt" value="${esc(S.rt)}" placeholder="${esc(t('rpTd'))}"><label for="sm">${t('sum')}</label><textarea id="sm">${esc(S.sum)}</textarea><label for="nt">${t('nts')}</label><textarea id="nt" style="min-height:70px">${esc(S.nts)}</textarea><label><input type="checkbox" id="rd" style="width:auto" ${S.red?'checked':''}> ${t('red')}</label><p class="row" style="margin-top:12px"><button class="btn" data-a="print">${t('prt')}</button><button class="btn ghost" data-a="dl">${t('dl')}</button></p>${rv?`<p class="note sm">${t('rRev',{n:rv})}</p>`:''}</div>
<div class="doc" id="doc"><h1 style="font-size:28px">${esc(f(S.rt||t('rpTd')))}</h1><p class="sm mute">SHAKKHI · ${new Date().toLocaleDateString()}</p><p class="note sm">${t('rLim')}</p><h2>${t('sum')}</h2><p style="white-space:pre-wrap">${esc(f(S.sum))}</p><h2>${t('s4')}</h2>${ev.map(e=>`<p><b>${esc(e.date)}: ${esc(f(e.title))}</b> (${t(e.st==='ok'?'sOk':e.st==='rv'?'sRv':'sAi')}, ${t(e.o==='ai'?'oai':'ouser')})<br>${esc(f(e.note))}${e.src?`<br><span class="sm mute">${t('sr')}: ${esc(nm(e.src))}</span>`:''}</p>`).join('')||`<p class="mute">${t('noTl')}</p>`}<h2>${t('rSug')}</h2><p>${lab.map(k=>t(k)).join(', ')||t('none')}</p><h2>${t('rSrc')}</h2>${S.items.map(i=>`<p class="sm">#${i.id} ${kindTag(i.kind)}</p>`).join('')}<h2>${t('nts')}</h2><p style="white-space:pre-wrap">${esc(f(S.nts))}</p></div>`}

$('#v').innerHTML=V[S.page]();$('#mb').textContent=t('menu');$('#exitb').textContent=t('exit');document.querySelector('[data-a=lang]').textContent=t('lang');$('#demoTag').innerHTML=S.demo?`<span class="tag demo">${t('demoOn')}</span>`:'';$('#nav').classList.remove('open');save();

async ocr(d){const i=S.items.find(x=>x.id==d.i);if(!i||!imgs[i.id])return;if(!window.Tesseract){toast(t('ocrFail'));return}const b=document.querySelector('[data-a="ocr"][data-i="'+i.id+'"]');if(b){b.disabled=true;b.textContent=t('ocrBusy')}try{const w=await Tesseract.createWorker('eng+ben');const r=await w.recognize(imgs[i.id]);await w.terminate();i.text=(r.data.text||'').trim();render();toast(t('ocrDone'))}catch(err){console.error('OCR failed',err);if(b){b.disabled=false;b.textContent=t('ocrBtn')}toast(t('ocrFail'))}},
